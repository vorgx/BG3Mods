<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e3e2dd; --accent: #2f5fd0; --warn-bg: #fff4dc; --warn: #8a5a00;
    --ok: #1f7a4d; --busy: #2f5fd0; --idle: #8a8a84; --blocked: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a29c;
      --line: #33332f; --accent: #8fb0ff; --warn-bg: #3a2d10; --warn: #f2c56b;
      --ok: #6fd3a0; --busy: #8fb0ff; --idle: #8a8a84; --blocked: #ff8a80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a29c;
    --line: #33332f; --accent: #8fb0ff; --warn-bg: #3a2d10; --warn: #f2c56b;
    --ok: #6fd3a0; --busy: #8fb0ff; --idle: #8a8a84; --blocked: #ff8a80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  section { margin-top: 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px; }
  .waiting { background: var(--warn-bg); color: var(--warn); border-radius: 8px;
    padding: 12px 16px; }
  .waiting ul { margin: 0; padding-left: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  code { font-size: 12px; color: var(--muted); word-break: break-all; }
  .state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .s-active .dot, .s-busy .dot { background: var(--busy); }
  .s-done .dot { background: var(--ok); }
  .s-blocked .dot { background: var(--blocked); }
  .baton { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 12px 16px; }
  .baton strong { font-size: 18px; color: var(--accent); }
  .baton span { color: var(--muted); font-size: 13px; }
  .baton p { flex-basis: 100%; margin: 0; font-size: 14px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .links a { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .group td { background: var(--bg); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .ver { font-variant-numeric: tabular-nums; white-space: nowrap; }
  ol { margin: 0; padding: 12px 16px 12px 34px; }
  .empty { color: var(--muted); padding: 12px 16px; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Team status</h1>
    <p id="meta"></p>
    <nav class="links" id="quick"></nav>
  </header>
  <section>
    <h2>Baton</h2>
    <div class="baton" id="baton"></div>
  </section>
  <section id="waiting-wrap">
    <h2>Waiting on you</h2>
    <div class="waiting" id="waiting"></div>
  </section>
  <section>
    <h2>Roles</h2>
    <div class="panel"><table>
      <thead><tr><th>Role</th><th>Tool</th><th>Model</th><th>State</th><th>Current task</th><th>Last report</th><th>Session</th></tr></thead>
      <tbody id="roles"></tbody>
    </table></div>
  </section>
  <section>
    <h2>Documents</h2>
    <div class="panel" id="docs"></div>
  </section>
  <section>
    <h2>Live changes</h2>
    <div class="panel" id="live"></div>
  </section>
  <section>
    <h2>Next up</h2>
    <div class="panel" id="next"></div>
  </section>
</main>
<script>
  const data = JSON.parse(document.getElementById('status').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.title = `${data.project} · Dashboard`;
  document.getElementById('title').textContent = `${data.project} · dashboard`;
  const link = (path, text) => `<a href="${esc(encodeURI(path || ''))}">${esc(text)}</a>`;
  document.getElementById('quick').innerHTML =
    (data.quickLinks || []).filter(l => l.path).map(l => link(l.path, l.title)).join('');
  document.getElementById('meta').textContent = `${data.type} · updated ${data.updated}`;

  const b = data.baton || {};
  document.getElementById('baton').innerHTML =
    `<strong>${esc(data.activeTool || 'nobody')}</strong>` +
    `<span>since ${esc(b.since)} · ${esc(b.by)}</span>` +
    (b.lastHandoff ? `<p>${esc(b.lastHandoff)}</p>` : '');

  const waiting = (data.waitingOnYou || []).filter(Boolean);
  if (waiting.length) {
    document.getElementById('waiting').innerHTML = `<ul>${waiting.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`;
  } else {
    document.getElementById('waiting-wrap').hidden = true;
  }

  document.getElementById('roles').innerHTML = (data.roles || []).map(r => `
    <tr>
      <td><strong>${esc(r.role)}</strong></td>
      <td>${esc(r.tool)}</td>
      <td>${esc(r.model)}</td>
      <td><span class="state s-${esc((r.state || 'idle').toLowerCase())}"><span class="dot"></span>${esc(r.state)}</span></td>
      <td>${esc(r.task)}</td>
      <td>${esc(r.last)}</td>
      <td><code>${esc(r.session)}</code></td>
    </tr>`).join('');

  const docs = (data.documents || []).filter(d => d.path && d.title);
  let lastGroup = null;
  document.getElementById('docs').innerHTML = docs.length
    ? `<table><thead><tr><th>Document</th><th>Version</th><th>Updated</th><th>Owner</th><th>Note</th></tr></thead><tbody>${
        docs.map(d => {
          const head = d.group && d.group !== lastGroup
            ? `<tr class="group"><td colspan="5">${esc(d.group)}</td></tr>` : '';
          lastGroup = d.group;
          return head + `<tr><td>${link(d.path, d.title)}</td><td class="ver">${esc(d.version || '—')}</td><td class="ver">${esc(d.updated)}</td><td>${esc(d.owner)}</td><td>${esc(d.note)}</td></tr>`;
        }).join('')
      }</tbody></table>`
    : '<p class="empty">No documents listed yet.</p>';

  const live = (data.live || []).filter(l => l.what && l.when);
  document.getElementById('live').innerHTML = live.length
    ? `<table><thead><tr><th>When</th><th>What</th><th>By</th><th>Receipt</th></tr></thead><tbody>${
        live.map(l => `<tr><td>${esc(l.when)}</td><td>${esc(l.what)}</td><td>${esc(l.by)}</td><td><code>${esc(l.receipt)}</code></td></tr>`).join('')
      }</tbody></table>`
    : '<p class="empty">No live changes yet.</p>';

  const next = (data.next || []).filter(Boolean);
  document.getElementById('next').innerHTML = next.length
    ? `<ol>${next.map(n => `<li>${esc(n)}</li>`).join('')}</ol>`
    : '<p class="empty">Nothing queued.</p>';
</script>
</body>
</html>
